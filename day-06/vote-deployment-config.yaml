apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voting-dev
  labels:
    app: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: dockersamples/examplevotingapp_vote
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: vote-config
